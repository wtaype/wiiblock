name: 🚀 Deploy wiiblock
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  IS_TAG: ${{ github.ref_type == 'tag' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ── 1. General ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.3 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      # ── 2. Firebase: build completo + deploy (solo main) ─────────────────────
      - name: 🔥 Firebase
        if: env.IS_TAG == 'false'
        env:
          VITE_BASE: /
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          pnpm build
          pnpm dlx firebase-tools deploy --only hosting \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --token "${{ secrets.FIREBASE_TOKEN }}"

      # ── 3. GitHub Pages: solo diseño, sin Firebase ────────────────────────────
      - name: 🐙 GitHub Pages
        env:
          VITE_BASE: ${{ github.ref_type == 'tag' && format('/wiiblock/{0}/', github.ref_name) || '/wiiblock/' }}
          DEST_DIR: ${{ github.ref_type == 'tag' && github.ref_name || '.' }}
        run: pnpm build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ github.ref_type == 'tag' && github.ref_name || '.' }}
          keep_files: true